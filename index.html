<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RGPV Result Portal</title>
  <style>
    :root {
      --background: #0c0f1a;
      --primary: #1f2335;
      --text: #ffffff;
      --subtext: #9ca3af;
      --highlight: #facc15;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--primary);
      max-width: 700px;
      width: 100%;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 12px;
      margin-bottom: 24px;
    }

    .section {
      margin-bottom: 20px;
    }

    .label {
      font-size: 14px;
      color: var(--subtext);
    }

    .value {
      font-size: 20px;
      font-weight: bold;
      color: var(--highlight);
      margin-top: 4px;
    }

    .info {
      font-size: 16px;
      font-weight: 600;
      margin-top: 8px;
    }

    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 13px;
      color: var(--subtext);
      border-top: 1px solid #2c2f3a;
      padding-top: 16px;
    }

    @media (max-width: 600px) {
      .value {
        font-size: 18px;
      }
      .info {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">RGPV Result — B.Tech 2nd Semester</div>

    <div class="section">
      <div class="label">Institute</div>
      <div class="info">Gyan Ganga Institute of Technology & Sciences</div>
    </div>

    <div class="section">
      <div class="label">Branch</div>
      <div class="info">B.Tech — Computer Science and Business Systems (CSBS)</div>
    </div>

    <div class="section">
      <div class="label">Semester</div>
      <div class="info">2nd Semester</div>
    </div>

    <div class="section">
      <div class="label">SGPA</div>
      <div class="value">9.4</div>
    </div>

    <div class="section">
      <div class="label">Name</div>
      <div class="info">Vivek Sharma</div>
    </div>

    <div class="footer">
      © 2025 RGPV Portal. All Rights Reserved.
    </div>
  </div>
</body>
</html>
